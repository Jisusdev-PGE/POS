<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d13">
<meta name="description" content="PanchOS — un sistema operativo web experimental de Pancho Games Studios.">
<title>PanchOS</title>
<style>
:root{
  --accent:#7c6cff;
  --accent-2:#9b8fff;
  --bg:#070910;
  --panel:rgba(20,23,34,.82);
  --panel-strong:rgba(13,16,25,.94);
  --card:rgba(255,255,255,.075);
  --card-hover:rgba(255,255,255,.115);
  --border:rgba(255,255,255,.13);
  --text:#f7f8ff;
  --muted:#a9adbf;
  --shadow:0 24px 70px rgba(0,0,0,.48);
  --radius:16px;
  --taskbar-h:68px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Inter,Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  background:var(--bg);
  user-select:none;
}
button,input,textarea,select{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#boot{
  position:fixed;inset:0;z-index:99999;background:#05060a;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .45s ease,visibility .45s ease;
}
#boot.hidden{opacity:0;visibility:hidden;pointer-events:none}
.boot-center{text-align:center;width:min(420px,88vw)}
.boot-logo{font-weight:900;font-size:72px;letter-spacing:-6px;line-height:1}
.boot-logo span{color:var(--accent)}
.boot-sub{color:#aeb1bf;margin-top:12px;font-size:14px}
.boot-track{height:5px;border-radius:99px;background:#1b1e28;margin:30px auto 10px;overflow:hidden}
.boot-fill{height:100%;width:8%;background:linear-gradient(90deg,var(--accent),#b2a9ff);border-radius:99px;transition:width .2s}
.boot-status{font-size:12px;color:#7f8394}
#desktop{
  position:fixed;inset:0 0 var(--taskbar-h) 0;overflow:hidden;
  background:
    radial-gradient(circle at 10% 16%,rgba(76,106,255,.34),transparent 34%),
    radial-gradient(circle at 87% 18%,rgba(158,82,255,.30),transparent 32%),
    radial-gradient(circle at 55% 88%,rgba(0,179,255,.12),transparent 35%),
    linear-gradient(135deg,#111526 0%,#090b12 52%,#090810 100%);
}
#desktop[data-wallpaper="sunset"]{
  background:
    radial-gradient(circle at 75% 23%,rgba(255,145,73,.45),transparent 31%),
    radial-gradient(circle at 25% 75%,rgba(255,72,122,.28),transparent 33%),
    linear-gradient(140deg,#1b1320,#34203a 50%,#10101a);
}
#desktop[data-wallpaper="ocean"]{
  background:
    radial-gradient(circle at 18% 18%,rgba(0,195,255,.40),transparent 32%),
    radial-gradient(circle at 82% 72%,rgba(24,91,255,.35),transparent 35%),
    linear-gradient(145deg,#081722,#09101c 55%,#050a12);
}
#desktop:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(transparent 70%,rgba(0,0,0,.18));
}
.desktop-content{position:absolute;inset:0;padding:24px;z-index:1}
.desktop-icons{display:flex;flex-direction:column;gap:10px;width:92px}
.desktop-icon{
  width:84px;min-height:82px;padding:8px 5px;border:1px solid transparent;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:default;text-align:center;font-size:12px;text-shadow:0 2px 8px #000;
}
.desktop-icon:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.08)}
.desktop-icon .icon{font-size:34px;line-height:1}
.desktop-icon .label{max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--taskbar-h);z-index:10000;
  display:flex;align-items:center;justify-content:center;gap:5px;
  background:rgba(8,10,16,.72);backdrop-filter:blur(28px) saturate(1.3);
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -10px 40px rgba(0,0,0,.15);
}
.tb-left,.tb-center,.tb-right{display:flex;align-items:center;height:100%}
.tb-left{position:absolute;left:10px;gap:4px}.tb-center{gap:4px}.tb-right{position:absolute;right:10px;gap:6px}
.tb-btn{
  width:48px;height:48px;border:0;background:transparent;border-radius:13px;
  cursor:pointer;font-size:23px;display:grid;place-items:center;transition:.16s;
}
.tb-btn:hover{background:rgba(255,255,255,.10)}.tb-btn.active{background:rgba(255,255,255,.14)}
.start-glyph{font-size:26px;color:#fff}
.clock{font-size:11px;line-height:1.25;text-align:right;min-width:68px;color:#e7e9f3}
.status-dot{width:8px;height:8px;border-radius:50%;background:#57df8a;box-shadow:0 0 10px #57df8a}
#start-menu{
  position:fixed;z-index:9500;left:50%;bottom:78px;transform:translate(-50%,16px) scale(.98);
  width:min(720px,calc(100vw - 24px));height:min(650px,calc(100vh - 92px));
  background:rgba(19,22,32,.88);backdrop-filter:blur(34px) saturate(1.35);
  border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.18s;
  display:flex;flex-direction:column;padding:18px;
}
#start-menu.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.search-wrap{display:flex;gap:9px}
.search-box{
  flex:1;height:46px;border:1px solid var(--border);background:rgba(0,0,0,.22);
  color:var(--text);border-radius:13px;padding:0 15px;outline:0;
}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}
.menu-head h3{margin:0;font-size:14px;font-weight:650}.muted{color:var(--muted)}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;overflow:auto;padding-right:3px}
.app-tile{
  min-height:98px;border:0;background:transparent;border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;
}
.app-tile:hover{background:var(--card-hover)}.app-tile .big{font-size:34px}.app-tile .tiny{color:var(--muted);font-size:10px}
.recent-card{
  margin-top:auto;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:13px;
  display:flex;align-items:center;gap:10px;font-size:12px;
}
#notify-center{
  position:fixed;z-index:9600;right:12px;bottom:78px;width:min(390px,calc(100vw - 24px));
  background:rgba(18,21,31,.92);backdrop-filter:blur(30px);border:1px solid var(--border);
  box-shadow:var(--shadow);border-radius:18px;padding:16px;opacity:0;pointer-events:none;
  transform:translateY(12px);transition:.18s;
}
#notify-center.open{opacity:1;pointer-events:auto;transform:none}
.notify-head{display:flex;justify-content:space-between;align-items:center}.notify-list{margin-top:12px;display:grid;gap:8px}
.notify-item{background:var(--card);border-radius:12px;padding:11px;font-size:12px}
.notify-item b{display:block;margin-bottom:3px;font-size:13px}
.window{
  position:absolute;z-index:100;width:650px;height:440px;min-width:340px;min-height:230px;
  background:var(--panel-strong);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.window.max{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - var(--taskbar-h) - 16px)!important;border-radius:14px}
.window.min{display:none}
.titlebar{
  height:48px;flex:0 0 48px;display:flex;align-items:center;padding:0 9px 0 15px;
  background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.07);cursor:move;
}
.title-icon{font-size:17px;margin-right:8px}.title-text{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.window-controls{display:flex;gap:2px}.win-btn{
  width:36px;height:32px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:15px
}.win-btn:hover{background:rgba(255,255,255,.09)}.win-btn.close:hover{background:#c73f52}
.window-content{flex:1;min-height:0;overflow:auto;padding:18px}
.window-content.flush{padding:0}
.window-content h1,.window-content h2,.window-content h3{margin-top:0}
.card{
  background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:15px
}
.row{display:flex;align-items:center;gap:9px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{
  border:1px solid var(--border);background:rgba(255,255,255,.07);padding:9px 13px;border-radius:10px;
  cursor:pointer;color:var(--text);transition:.15s
}.btn:hover{background:rgba(255,255,255,.12)}.btn.primary{background:var(--accent);border-color:transparent}
.btn.danger{background:rgba(207,57,76,.16);border-color:rgba(207,57,76,.28)}
.file-toolbar{display:flex;gap:8px;margin-bottom:14px}.path-box{
  flex:1;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:12px
}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
.file-card{
  padding:15px 8px;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:13px;
  cursor:pointer;text-align:center;min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px
}
.file-card:hover{background:var(--card-hover);border-color:rgba(255,255,255,.08)}
.file-card .fi{font-size:36px}.file-card .fn{font-size:11px;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor{height:100%;display:flex;flex-direction:column}.editor textarea{
  flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;background:#0a0c12;color:#f2f3f8;
  padding:18px;font:14px/1.65 Consolas,ui-monospace,monospace
}
.editor-bar{padding:9px 13px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.035);border-top:1px solid rgba(255,255,255,.07);font-size:11px}
.note-area{height:100%;width:100%;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:7px;font-size:15px;line-height:1.6}
.term-shell{height:100%;display:flex;flex-direction:column;background:#050708;color:#d8ffd8;font:13px/1.55 Consolas,ui-monospace,monospace}
.term-output{flex:1;overflow:auto;padding:15px;white-space:pre-wrap;word-break:break-word}
.term-line{display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.05);padding:10px 14px}.term-prompt{color:#8aff9d;margin-right:7px}
.term-input{flex:1;border:0;outline:0;background:transparent;color:#e6ffe7;font:inherit}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:440px;margin:auto}
.calc-display{grid-column:1/-1;height:75px;padding:12px 15px;border:1px solid var(--border);border-radius:13px;background:#05060a;color:#fff;text-align:right;font-size:28px}
.calc button{height:55px;border:1px solid var(--border);background:rgba(255,255,255,.06);border-radius:12px;cursor:pointer;font-size:16px}.calc button:hover{background:rgba(255,255,255,.12)}
.settings-list{display:grid;gap:9px}.setting{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:13px;background:var(--card)
}
.setting .desc{font-size:12px;color:var(--muted);margin-top:3px}.setting select,.setting input[type=color]{
  background:#0c0f17;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:7px
}
.toggle{width:44px;height:25px;position:relative}.toggle input{display:none}.toggle span{
  position:absolute;inset:0;background:#303443;border-radius:99px;cursor:pointer;transition:.15s
}.toggle span:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.toggle input:checked+span{background:var(--accent)}.toggle input:checked+span:before{transform:translateX(19px)}
.about-hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}.about-logo{
  width:65px;height:65px;border-radius:18px;display:grid;place-items:center;font-size:25px;font-weight:900;
  background:linear-gradient(135deg,var(--accent),#241d54);box-shadow:0 12px 35px rgba(124,108,255,.25)
}
.monitor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric h4{margin:0;font-size:12px;color:var(--muted)}.metric strong{font-size:25px;display:block;margin-top:5px}
.progress{height:7px;border-radius:99px;background:#262a36;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.context{
  position:fixed;z-index:11000;display:none;width:210px;background:rgba(20,23,33,.97);border:1px solid var(--border);
  box-shadow:var(--shadow);border-radius:12px;padding:6px
}.context.open{display:block}.ctx-btn{
  display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:12px
}.ctx-btn:hover{background:rgba(255,255,255,.08)}
.toast{
  position:fixed;right:15px;bottom:84px;z-index:12000;background:rgba(20,23,33,.96);border:1px solid var(--border);
  border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none
}.toast.show{opacity:1;transform:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{padding:4px 7px;border-radius:99px;background:rgba(124,108,255,.14);color:#bdb6ff;font-size:10px}
.small{font-size:11px}.center{text-align:center}
@media(max-width:800px){
  :root{--taskbar-h:62px}
  #desktop{inset:0 0 var(--taskbar-h) 0}.desktop-content{padding:13px}
  .desktop-icons{display:grid;grid-template-columns:repeat(2,84px);width:auto}
  .app-grid{grid-template-columns:repeat(3,1fr)}
  .tb-left{display:none}.clock{min-width:58px}
  .window{left:6px!important;top:6px!important;width:calc(100vw - 12px)!important;height:calc(100vh - var(--taskbar-h) - 12px)!important;border-radius:14px}
}
@media(max-width:500px){
  .boot-logo{font-size:55px}.app-grid{grid-template-columns:repeat(2,1fr)}.monitor-grid{grid-template-columns:1fr}
  #start-menu{padding:12px}.menu-head{padding:13px 4px 9px}
}
</style>
</head>
<body>
<div id="boot">
  <div class="boot-center">
    <div class="boot-logo">Panch<span>OS</span></div>
    <div class="boot-sub">Pancho Games Studios • Web Edition</div>
    <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
    <div class="boot-status" id="boot-status">Comprobando sistema...</div>
  </div>
</div>
<script>
(function(){
  setTimeout(function(){
    var b=document.getElementById('boot');
    if(b){b.classList.add('hidden');setTimeout(function(){b.remove()},500)}
  },6000);
})();
</script>

<div id="desktop" data-wallpaper="aurora">
  <div class="desktop-content">
    <div class="desktop-icons" id="desktop-icons">
      <div class="desktop-icon" ondblclick="openApp('files')"><span class="icon">📁</span><span class="label">Archivos</span></div>
      <div class="desktop-icon" ondblclick="openApp('notes')"><span class="icon">📝</span><span class="label">Notas</span></div>
      <div class="desktop-icon" ondblclick="openApp('terminal')"><span class="icon">⌨️</span><span class="label">Terminal</span></div>
      <div class="desktop-icon" ondblclick="openApp('settings')"><span class="icon">⚙️</span><span class="label">Configuración</span></div>
      <div class="desktop-icon" ondblclick="openApp('monitor')"><span class="icon">📊</span><span class="label">Monitor</span></div>
    </div>
  </div>
</div>

<div id="start-menu" aria-hidden="true">
  <div class="search-wrap"><input id="app-search" class="search-box" placeholder="Buscar aplicaciones..." autocomplete="off"><button class="btn" onclick="toggleStart()">Esc</button></div>
  <div class="menu-head"><h3>Aplicaciones</h3><span class="small muted" id="app-count"></span></div>
  <div class="app-grid" id="app-grid"></div>
  <div class="recent-card"><span style="font-size:25px">💜</span><div><b>PanchOS 2.0 Web</b><div class="muted">Sesión lista • sistema operativo experimental</div></div><span class="badge" style="margin-left:auto">ONLINE</span></div>
</div>

<div id="notify-center">
  <div class="notify-head"><b>Notificaciones</b><button class="btn" onclick="toggleNotifications()">Limpiar</button></div>
  <div class="notify-list" id="notify-list"></div>
</div>

<div class="context" id="context-menu">
  <button class="ctx-btn" onclick="hideContext();location.reload()">↻ Actualizar escritorio</button>
  <button class="ctx-btn" onclick="hideContext();openApp('files')">📁 Abrir Archivos</button>
  <button class="ctx-btn" onclick="hideContext();openApp('terminal')">⌨️ Abrir Terminal</button>
  <button class="ctx-btn" onclick="hideContext();newDesktopFile()">📄 Nuevo archivo</button>
</div>

<div class="toast" id="toast"></div>

<div id="taskbar">
  <div class="tb-left">
    <button class="tb-btn" title="Buscar" onclick="toggleStart()">🔎</button>
    <button class="tb-btn" title="Escritorio" onclick="closeAllWindows()">⌂</button>
  </div>
  <div class="tb-center" id="task-buttons">
    <button class="tb-btn" title="Inicio" onclick="toggleStart()"><span class="start-glyph">◈</span></button>
    <button class="tb-btn" title="Archivos" onclick="openApp('files')">📁</button>
    <button class="tb-btn" title="Notas" onclick="openApp('notes')">📝</button>
    <button class="tb-btn" title="Terminal" onclick="openApp('terminal')">⌨️</button>
    <button class="tb-btn" title="Calculadora" onclick="openApp('calc')">🧮</button>
  </div>
  <div class="tb-right">
    <button class="tb-btn" title="Notificaciones" onclick="toggleNotifications()">🔔</button>
    <span class="status-dot" title="Sistema en línea"></span>
    <div class="clock" id="clock"></div>
  </div>
</div>

<script>
var APPS=[
  {id:'files',name:'Archivos',icon:'📁',desc:'Explorador de archivos'},
  {id:'notes',name:'Notas',icon:'📝',desc:'Bloc de notas'},
  {id:'terminal',name:'Terminal',icon:'⌨️',desc:'PanchShell'},
  {id:'calc',name:'Calculadora',icon:'🧮',desc:'Cálculos rápidos'},
  {id:'settings',name:'Configuración',icon:'⚙️',desc:'Personaliza PanchOS'},
  {id:'monitor',name:'Monitor',icon:'📊',desc:'Estado del sistema'},
  {id:'about',name:'Acerca de',icon:'💜',desc:'Información de PanchOS'},
  {id:'browser',name:'Navegador',icon:'🌐',desc:'Visor web experimental'}
];

var windows={};
var zCounter=100;
var cascade=0;
var noteKey='panchos.notes.v2';
var vfsKey='panchos.vfs.v2';
var settingsKey='panchos.settings.v2';
var notifications=[
  {title:'PanchOS listo',body:'La sesión se inició correctamente.'},
  {title:'Web Edition',body:'Los datos del sistema se guardan localmente en este navegador.'}
];
var settings={
  wallpaper:'aurora',
  accent:'#7c6cff',
  animations:true,
  transparency:true,
  compact:false
};

function qs(s,r){return (r||document).querySelector(s)}
function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})
}
function toast(msg){
  var t=qs('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);
  window.__toast=setTimeout(function(){t.classList.remove('show')},2400)
}
function addNotification(title,body){
  notifications.unshift({title:title,body:body});
  notifications=notifications.slice(0,8);
  renderNotifications();
}
function renderNotifications(){
  var box=qs('#notify-list');
  if(!notifications.length){box.innerHTML='<div class="empty">Sin notificaciones</div>';return}
  box.innerHTML=notifications.map(function(n){return '<div class="notify-item"><b>'+esc(n.title)+'</b><span class="muted">'+esc(n.body)+'</span></div>'}).join('')
}
function toggleNotifications(){
  qs('#notify-center').classList.toggle('open');
  qs('#start-menu').classList.remove('open');
  if(qs('#notify-list').children.length&&qs('#notify-center').classList.contains('open'))renderNotifications()
}
function toggleStart(){
  var m=qs('#start-menu');m.classList.toggle('open');qs('#notify-center').classList.remove('open');
  if(m.classList.contains('open')){qs('#app-search').value='';renderAppGrid();setTimeout(function(){qs('#app-search').focus()},30)}
}
function renderAppGrid(list){
  var grid=qs('#app-grid');list=list||APPS;
  qs('#app-count').textContent=list.length+' apps';
  grid.innerHTML=list.map(function(a){
    return '<button class="app-tile" onclick="openApp(\''+a.id+'\')"><span class="big">'+a.icon+'</span><span>'+esc(a.name)+'</span><span class="tiny">'+esc(a.desc)+'</span></button>'
  }).join('')||'<div class="empty" style="grid-column:1/-1">No se encontraron aplicaciones.</div>'
}
qs('#app-search').addEventListener('input',function(){
  var q=this.value.toLowerCase().trim();
  renderAppGrid(APPS.filter(function(a){return a.name.toLowerCase().indexOf(q)>-1||a.desc.toLowerCase().indexOf(q)>-1}))
});

function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(settingsKey)||'null');if(s)settings=Object.assign(settings,s)
  }catch(e){}
  applySettings();
  renderNotifications();
}
function applySettings(){

function bindWindow(w,id){
  qsa('[data-act]',w).forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();var act=b.dataset.act;
      if(act==='close')closeApp(id);if(act==='min')minimizeApp(id);if(act==='max')toggleMax(id)
    })
  });
  var bar=qs('.titlebar',w),sx=0,sy=0,sl=0,st=0,dragging=false;
  bar.addEventListener('pointerdown',function(e){
    if(e.target.closest('.window-controls'))return;
    if(w.classList.contains('max'))return;
    dragging=true;sx=e.clientX;sy=e.clientY;sl=w.offsetLeft;st=w.offsetTop;
    bar.setPointerCapture(e.pointerId)
  });
  bar.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var x=Math.max(0,Math.min(innerWidth-w.offsetWidth,sl+e.clientX-sx));
    var y=Math.max(0,Math.min(innerHeight-80,st+e.clientY-sy));

}

function terminalCommand(raw){

  if(cmd==='help')return 'help       Ver comandos\\nclear      Limpia la pantalla\\ndate       Fecha actual\\ntime       Hora actual\\necho       Imprime texto\\nneofetch   Información del sistema\\nls         Lista archivos virtuales\\npwd        Carpeta actual\\ncd         Cambia de carpeta\\nmkdir      Crea una carpeta\\ntouch      Crea un archivo\\ncat        Lee un archivo\\nopen       Abre una aplicación\\ntheme      Tema aurora|sunset|ocean\\nstatus     Estado del sistema\\nwhoami     Usuario actual\\nabout      Sobre PanchOS\\nreboot     Reinicia la sesión';
  if(cmd==='clear'){qs('#term-output',windows.terminal.el).innerHTML='';return''}
  if(cmd==='date')return new Date().toLocaleDateString();
  if(cmd==='time')return new Date().toLocaleTimeString();
  if(cmd==='echo')return arg;
  if(cmd==='whoami')return'pancho';
  if(cmd==='about')return'PanchOS 2.0 Web — Pancho Games Studios';
  if(cmd==='neofetch')return'        ╭──────────────╮\\n        │    PanchOS   │\\n        ╰──────────────╯\\nOS: PanchOS Web Edition\\nKernel: WebKernel 2.0\\nShell: PanchShell 2.0\\nUI: PanchUI\\nEngine: HTML5 + CSS + JavaScript\\nCPU threads: '+(navigator.hardwareConcurrency||'N/A')+'\\nOnline: YES';
  if(cmd==='status')return'Estado: ONLINE\\nApps abiertas: '+Object.keys(windows).length+'\\nAlmacenamiento virtual: '+Object.keys(v).length+' entradas';
  if(cmd==='pwd')return'/home/pancho';
  if(cmd==='ls')return(v['/'].children||[]).join('  ')||'(vacío)';
  if(cmd==='theme'){if(['aurora','sunset','ocean'].indexOf(arg)<0)return'Usa: theme aurora|sunset|ocean';settings.wallpaper=arg;saveSettings();return'Tema cambiado a '+arg}
  if(cmd==='mkdir'){if(!arg)return'Uso: mkdir <nombre>';var p='/'+arg,vv=getVfs();if(vv[p])return'Ya existe: '+arg;vv[p]={type:'dir',name:arg,parent:'/',children:[]};vv['/'].children.push(arg);saveVfs(vv);return'Creada carpeta '+arg}
  if(cmd==='touch'){if(!arg)return'Uso: touch <archivo>';var fp='/'+arg,vv2=getVfs();if(vv2[fp])return'Ya existe: '+arg;vv2[fp]={type:'file',name:arg,parent:'/',mime:'text/plain',content:''};vv2['/'].children.push(arg);saveVfs(vv2);return'Creado '+arg}
  if(cmd==='cat'){var cp='/'+arg,nn=v[cp];return nn&&nn.type==='file'?(nn.content||'(vacío)'):'Archivo no encontrado'}
  if(cmd==='open'){
    var map={files:'files',archivos:'files',notes:'notes',notas:'notes',terminal:'terminal',calc:'calc',calculadora:'calc',settings:'settings',configuracion:'settings',monitor:'monitor',about:'about',browser:'browser',navegador:'browser'};
    if(!map[arg.toLowerCase()])return'App no encontrada';openApp(map[arg.toLowerCase()]);return'Abrriendo '+arg
  }
  if(cmd==='reboot'){setTimeout(function(){location.reload()},250);return'Reiniciando PanchOS...'}
  return'Comando no encontrado: '+cmd
}

  if(e.target.closest('.window')||e.target.closest('#taskbar')||e.target.closest('#start-menu'))return;
  e.preventDefault();var m=qs('#context-menu');m.style.left=Math.min(e.clientX,innerWidth-220)+'px';m.style.top=Math.min(e.clientY,innerHeight-250)+'px';m.classList.add('open')
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#context-menu'))hideContext();
  if(!e.target.closest('#notify-center')&&!e.target.closest('[title="Notificaciones"]'))qs('#notify-center').classList.remove('open')
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey&&e.key==='Escape')||e.key==='Meta'){e.preventDefault();toggleStart()}
  if(e.key==='Escape'){qs('#start-menu').classList.remove('open');hideContext()}
});
function updateClock(){
  var d=new Date(),time=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),date=d.toLocaleDateString([], {day:'2-digit',month:'2-digit',year:'numeric'});
  qs('#clock').innerHTML=time+'<br>'+date
}
setInterval(updateClock,1000);updateClock();

renderAppGrid();loadState();
var bootFill=qs('#boot-fill'),bootStatus=qs('#boot-status');
var bootSteps=[
  [120,'Cargando WebKernel...'],[300,'Montando sistema de archivos...'],[500,'Iniciando PanchUI...'],[720,'Preparando aplicaciones...'],[940,'Restaurando sesión...'],[1160,'Listo.']
];
bootSteps.forEach(function(s){setTimeout(function(){bootFill.style.width=Math.min(100,Math.round(s[0]/11.6))+'%';bootStatus.textContent=s[1]},s[0])});
setTimeout(function(){qs('#boot').classList.add('hidden');setTimeout(function(){var b=qs('#boot');if(b)b.remove()},500);addNotification('Sesión iniciada','PanchOS está listo para usar.')},1350);

window.addEventListener('beforeunload',function(){Object.keys(windows).forEach(function(id){if(windows[id].el.__cleanup)windows[id].el.__cleanup()})});
</script>
